# Déploiement de voidrelay.fr sur Cloudflare Pages (projet "warframe-hub").
# Depuis le 19/10/2026 le site se déploie d'ici via Wrangler (le projet Pages
# n'est plus relié à un dépôt Git : déploiements automatiques coupés côté Cloudflare).
#
# Deux déclencheurs :
#  - un push sur main (humain ou PR fusionnée) ;
#  - la fin d'un robot qui committe des données : un commit poussé avec
#    GITHUB_TOKEN ne déclenche AUCUN autre workflow, d'où le workflow_run.
#
# Secrets requis : CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages : Modifier")
# et CLOUDFLARE_ACCOUNT_ID.
name: Déploiement Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Warframe Hub - data update (1x/jour)"
      - "Warframe Hub - weekly news digest"
      - "Pages objets (SEO)"
      - "Rapport hebdo EN objets"
      - "Post social faceless"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement-cloudflare
  cancel-in-progress: false

jobs:
  deployer:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : rien déployé."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy . \
            --project-name warframe-hub \
            --branch main \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "$(git log -1 --format=%s | cut -c1-200)" \
            --commit-dirty=true
