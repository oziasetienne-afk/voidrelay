# Garde anti-fuite (19/10/2026) : bloque tout push / PR qui ajoute un secret
# (gitleaks) ou une info personnelle (scripts/garde_perso.py).
# Complète la "push protection" de GitHub, qui ne connaît que les formats de
# clés des grands fournisseurs.
name: Garde secrets et infos perso

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: garde-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plage de commits à vérifier
        id: plage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "tete=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Après un force-push (rebase d'une branche de PR) ou sur une branche neuve,
            # github.event.before n'existe plus (ou vaut 0000…) : `git log avant..après`
            # sortait en erreur 128 et la garde rougissait sans rien avoir vérifié
            # (vu le 21/10/2026 sur la PR #8). Repli : la base commune avec main, donc
            # TOUS les commits de la branche sont relus — plus large, jamais moins.
            AVANT="${{ github.event.before }}"
            if ! git cat-file -e "${AVANT}^{commit}" 2>/dev/null; then
              AVANT=$(git merge-base origin/main "${{ github.sha }}")
            fi
            echo "base=${AVANT}" >> "$GITHUB_OUTPUT"
            echo "tete=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Infos personnelles (identité des commits + contenu ajouté)
        run: python3 scripts/garde_perso.py "${{ steps.plage.outputs.base }}" "${{ steps.plage.outputs.tete }}"

      - name: Secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          BASE="${{ steps.plage.outputs.base }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner
          else
            /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="${BASE}..${{ steps.plage.outputs.tete }}"
          fi
