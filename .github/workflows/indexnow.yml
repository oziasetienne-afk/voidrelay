name: IndexNow (Bing/Yandex…)

# Notifie les moteurs IndexNow (Bing, Yandex, Seznam, Naver…) des URLs du site,
# pour une indexation rapide PARTOUT (pas seulement Google). Aucun compte requis :
# le fichier-clé <key>.txt est servi à la racine du site.

on:
  schedule:
    - cron: "11 7 * * 1"        # lundi 07:11 UTC (filet de sécurité hebdo)
  # 09/07/2026 : ping aussi juste APRÈS chaque régénération de contenu réussie,
  # au lieu d'un seul rendez-vous hebdo en aveugle — les moteurs sont notifiés
  # dès que les pages changent réellement.
  workflow_run:
    workflows: ["Pages objets (SEO)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    # Déclenché par workflow_run : ne pinger que si la régénération a réussi
    # (un échec = pages inchangées, inutile de notifier les moteurs).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 09/07/2026 : lit le sitemap depuis MAIN (la branche claude/warframe-updates-app-thkv5
      # est abandonnée et figée — elle faisait pinger des URLs obsolètes ; cf. pages-objets.yml).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Soumettre les URLs à IndexNow
        run: node scripts/indexnow.mjs
