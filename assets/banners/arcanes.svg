<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="VoidRelay — Arcanes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.55" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e7c75b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e7c75b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e7c75b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e7c75b" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="56" height="64" patternUnits="userSpaceOnUse">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none"
            stroke="#e7c75b" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#hex)"/>
  <rect width="1200" height="360" fill="url(#halo)"/>
  <rect x="0" y="354" width="1200" height="6" fill="url(#edge)"/>
  <g transform="translate(910,180)" filter="url(#glow)" stroke="#e7c75b"
     stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Losange d'arcane central + rangs en orbite -->
    <path d="M0 -84 L52 0 L0 84 L-52 0 Z"/>
    <path d="M0 -46 L28 0 L0 46 L-28 0 Z" opacity="0.6"/>
    <circle r="118" opacity="0.35" stroke-dasharray="4 14"/>
    <path d="M-150 -52 L-128 -18 L-150 16 L-172 -18 Z" opacity="0.75" stroke-width="4"/>
    <path d="M132 44 L150 72 L132 100 L114 72 Z" opacity="0.7" stroke-width="4"/>
    <path d="M96 -110 L110 -88 L96 -66 L82 -88 Z" opacity="0.55" stroke-width="4"/>
  </g>
</svg>
