<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="VoidRelay — TennoCon 2026 : les annonces">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a1e"/>
      <stop offset="0.55" stop-color="#0c0817"/>
      <stop offset="1" stop-color="#07050d"/>
    </linearGradient>
    <radialGradient id="haloGold" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloPurple" cx="0.12" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloIce" cx="0.9" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowT" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hexT" width="56" height="64" patternUnits="userSpaceOnUse">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.06"/>
    </pattern>
    <linearGradient id="edgeT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bgT)"/>
  <rect width="1200" height="360" fill="url(#hexT)"/>
  <rect width="1200" height="360" fill="url(#haloGold)"/>
  <rect width="1200" height="360" fill="url(#haloPurple)"/>
  <rect width="1200" height="360" fill="url(#haloIce)"/>

  <!-- étoiles de fond -->
  <g fill="#e8ecf4" opacity="0.5">
    <circle cx="80" cy="50" r="1.5"/><circle cx="200" cy="290" r="1.2"/><circle cx="340" cy="35" r="1.3"/>
    <circle cx="1000" cy="300" r="1.3"/><circle cx="1130" cy="70" r="1.5"/><circle cx="1080" cy="190" r="1.1"/>
  </g>

  <!-- Fornax : cité-anneau Sentient concentrique, centre de la composition -->
  <g filter="url(#glowT)" opacity="0.85">
    <circle cx="600" cy="180" r="118" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.55"/>
    <circle cx="600" cy="180" r="88" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
    <circle cx="600" cy="180" r="58" fill="none" stroke="#f4e9c9" stroke-width="2" opacity="0.6"/>
    <circle cx="600" cy="180" r="14" fill="#f4e9c9" opacity="0.9"/>
  </g>
  <!-- flèches/rayons du Système Tau -->
  <g stroke="#d4af37" stroke-width="1" opacity="0.35">
    <line x1="600" y1="62" x2="600" y2="20"/>
    <line x1="600" y1="298" x2="600" y2="340"/>
    <line x1="482" y1="180" x2="440" y2="180"/>
    <line x1="718" y1="180" x2="760" y2="180"/>
  </g>

  <!-- cartes à jouer flottantes (thème casino de Brysko / Portau) à gauche -->
  <g transform="translate(150,150) rotate(-18)" filter="url(#glowT)">
    <rect x="0" y="0" width="70" height="98" rx="8" fill="#150c22" stroke="#8b5cf6" stroke-width="2"/>
    <text x="12" y="30" font-family="Oswald, sans-serif" font-size="26" fill="#8b5cf6">♠</text>
  </g>
  <g transform="translate(210,190) rotate(6)" filter="url(#glowT)">
    <rect x="0" y="0" width="70" height="98" rx="8" fill="#150c22" stroke="#d4af37" stroke-width="2"/>
    <text x="14" y="32" font-family="Oswald, sans-serif" font-size="26" fill="#d4af37">♦</text>
  </g>

  <!-- éclat de glace (Narin) à droite -->
  <g transform="translate(960,140)" filter="url(#glowT)" opacity="0.9">
    <path d="M40 0 L54 34 L88 40 L54 46 L40 80 L26 46 L0 40 L26 34 Z" fill="#dff4ff" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- petites étincelles roulette / jetons -->
  <g fill="#d4af37" opacity="0.5">
    <circle cx="330" cy="260" r="5"/><circle cx="360" cy="245" r="3.5"/><circle cx="300" cy="230" r="3"/>
  </g>

  <rect x="0" y="354" width="1200" height="6" fill="url(#edgeT)"/>
</svg>
