<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="VoidRelay — Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.55" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="56" height="64" patternUnits="userSpaceOnUse">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#hex)"/>
  <rect width="1200" height="360" fill="url(#halo)"/>
  <rect x="0" y="354" width="1200" height="6" fill="url(#edge)"/>
  <g transform="translate(900,180)" filter="url(#glow)" stroke="#818cf8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cadran radar concentrique (tableau de bord) -->
    <circle cx="0" cy="0" r="86" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="56" stroke-width="2" stroke-opacity="0.28"/>
    <circle cx="0" cy="0" r="26" stroke-width="4"/>
    <!-- Balayage + satellites de suivi -->
    <path d="M0 0 L74 -44" stroke-width="5"/>
    <path d="M0 0 L-40 66" stroke-width="3" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="7" fill="#818cf8" stroke="none" fill-opacity="0.95"/>
    <circle cx="74" cy="-44" r="6" fill="#818cf8" stroke="none" fill-opacity="0.85"/>
    <circle cx="-40" cy="66" r="5" fill="#818cf8" stroke="none" fill-opacity="0.7"/>
  </g>
</svg>
