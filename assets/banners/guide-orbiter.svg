<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="VoidRelay — L'Orbiter, ton quartier général">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.55" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2c49"/>
      <stop offset="1" stop-color="#0e1729"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="56" height="64" patternUnits="userSpaceOnUse">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none"
            stroke="#d4af37" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#hex)"/>
  <rect width="1200" height="360" fill="url(#halo)"/>

  <!-- étoiles -->
  <g fill="#e8ecf4" opacity="0.5">
    <circle cx="110" cy="70" r="1.5"/><circle cx="250" cy="290" r="1.2"/><circle cx="380" cy="55" r="1.3"/>
    <circle cx="530" cy="315" r="1.2"/><circle cx="700" cy="45" r="1.4"/><circle cx="860" cy="300" r="1.2"/>
    <circle cx="1010" cy="70" r="1.5"/><circle cx="1130" cy="250" r="1.3"/><circle cx="180" cy="180" r="1.1"/>
  </g>

  <!-- silhouette de l'Orbiter (coque en losange + ailes) -->
  <g transform="translate(600,185)">
    <g filter="url(#glow)">
      <path d="M-240 40 L-90 -18 L0 -78 L90 -18 L240 40 L150 62 L0 30 L-150 62 Z"
            fill="url(#hull)" stroke="#d4af37" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0 -78 L0 30" stroke="#d4af37" stroke-width="1.4" opacity="0.5"/>
      <path d="M-90 -18 L0 4 L90 -18" fill="none" stroke="#d4af37" stroke-width="1.4" opacity="0.5"/>
    </g>
    <!-- consoles du QG : points lumineux reliés -->
    <g filter="url(#glow)">
      <path d="M-150 20 L-75 -8 L0 -34 L75 -8 L150 20" fill="none" stroke="#87600f" stroke-width="1.6" opacity="0.85"/>
      <circle cx="-150" cy="20" r="7" fill="#d8b45a"/>
      <circle cx="-75" cy="-8" r="6" fill="#d8b45a"/>
      <circle cx="0" cy="-34" r="9" fill="#f4e9c9" stroke="#d4af37" stroke-width="2"/>
      <circle cx="75" cy="-8" r="6" fill="#d8b45a"/>
      <circle cx="150" cy="20" r="7" fill="#d8b45a"/>
    </g>
    <!-- traînée de propulsion -->
    <g opacity="0.75">
      <path d="M-150 62 L-205 96" stroke="#5b7a9e" stroke-width="3" stroke-linecap="round"/>
      <path d="M150 62 L205 96" stroke="#5b7a9e" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 30 L0 100" stroke="#5b7a9e" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="0" y="354" width="1200" height="6" fill="url(#edge)"/>
</svg>
