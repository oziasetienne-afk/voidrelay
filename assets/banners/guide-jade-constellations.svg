<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="VoidRelay — Les Ombres de Jade : Constellations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.55" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="haloG" cx="0.80" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="0.20" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d4af37" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5484d" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="56" height="64" patternUnits="userSpaceOnUse">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none"
            stroke="#d4af37" stroke-width="1" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#hex)"/>
  <rect width="1200" height="360" fill="url(#haloG)"/>
  <rect width="1200" height="360" fill="url(#haloR)"/>

  <!-- étoiles de fond -->
  <g fill="#e8ecf4" opacity="0.55">
    <circle cx="90" cy="60" r="1.6"/><circle cx="210" cy="300" r="1.2"/><circle cx="330" cy="40" r="1.4"/>
    <circle cx="480" cy="320" r="1.2"/><circle cx="560" cy="70" r="1.5"/><circle cx="700" cy="330" r="1.3"/>
    <circle cx="840" cy="50" r="1.4"/><circle cx="990" cy="310" r="1.3"/><circle cx="1120" cy="80" r="1.6"/>
    <circle cx="1050" cy="200" r="1.1"/><circle cx="150" cy="180" r="1.1"/><circle cx="640" cy="180" r="1.2"/>
  </g>

  <!-- constellation d'Orion (rouge, gauche) -->
  <g filter="url(#glow)">
    <path d="M120 250 L215 190 L320 235 L400 150 L480 195" fill="none" stroke="#f87171" stroke-width="2" opacity="0.75"/>
    <g fill="#f87171">
      <circle cx="120" cy="250" r="5"/><circle cx="215" cy="190" r="7"/><circle cx="320" cy="235" r="5"/>
      <circle cx="400" cy="150" r="8"/><circle cx="480" cy="195" r="5"/>
    </g>
    <g fill="none" stroke="#f87171" opacity="0.5">
      <circle cx="400" cy="150" r="14"/><circle cx="215" cy="190" r="12"/>
    </g>
  </g>

  <!-- constellation de Sirius (verte, droite) -->
  <g filter="url(#glow)">
    <path d="M1080 240 L985 175 L880 225 L800 140 L720 190" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.75"/>
    <g fill="#4ade80">
      <circle cx="1080" cy="240" r="5"/><circle cx="985" cy="175" r="7"/><circle cx="880" cy="225" r="5"/>
      <circle cx="800" cy="140" r="8"/><circle cx="720" cy="190" r="5"/>
    </g>
    <g fill="none" stroke="#4ade80" opacity="0.5">
      <circle cx="800" cy="140" r="14"/><circle cx="985" cy="175" r="12"/>
    </g>
  </g>

  <!-- collision céleste au centre -->
  <g>
    <circle cx="600" cy="178" r="86" fill="url(#clash)"/>
    <g filter="url(#glow)">
      <path d="M480 195 L586 178" fill="none" stroke="#f87171" stroke-width="2" opacity="0.6"/>
      <path d="M720 190 L614 178" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
      <path d="M600 148 L608 170 L630 178 L608 186 L600 208 L592 186 L570 178 L592 170 Z"
            fill="#f4e9c9" stroke="#d4af37" stroke-width="2"/>
    </g>
  </g>

  <rect x="0" y="354" width="1200" height="6" fill="url(#edge)"/>
</svg>
